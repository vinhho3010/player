<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Player Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .video-item.active { 
            border-color: #f5576c; 
            background-color: #fff8f9;
            box-shadow: 0 10px 15px -3px rgba(245, 87, 108, 0.1);
        }
        .pause-row:hover { transform: translateX(5px); }
        video { border-radius: 12px; max-height: 100%; width: 100%; object-fit: contain; background: #000; }
        .modal-open { overflow: hidden !important; }
        
        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .is-playing-icon { animation: pulse-red 1.5s infinite; color: #f5576c; }
        .drag-ghost { opacity: 0.5; background: #f1f5f9; border: 2px dashed #cbd5e1; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }

        /* Custom Toggle Style for Dark Theme */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f5576c;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #f5576c;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#1a2a6c] via-[#b21f1f] to-[#fdbb2d] min-h-screen p-2 md:p-5 text-gray-800">

    <div class="max-w-[1600px] mx-auto flex flex-col-reverse lg:flex-row gap-5 h-auto lg:h-[92vh]">
        
        <div class="w-full lg:w-[450px] bg-white/95 backdrop-blur shadow-2xl rounded-3xl p-5 flex flex-col h-[650px] lg:h-full transition-all">
            <h2 class="text-2xl font-bold mb-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="clapperboard" class="text-[#f5576c]"></i> 
                    <span>Playlist</span>
                </div>
                <span id="itemCount" class="text-xs bg-gray-100 px-2 py-1 rounded-full text-gray-500">0 mục</span>
            </h2>

            <div class="grid grid-cols-2 gap-2 mb-4">
                <button id="btnExport" onclick="exportDataZip()" class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl transition-all shadow-md active:scale-95 text-sm">
                    <i data-lucide="archive" class="w-4 h-4"></i> Xuất ZIP
                </button>
                <button id="btnImport" onclick="document.getElementById('importFile').click()" class="flex items-center justify-center gap-2 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-xl transition-all shadow-md active:scale-95 text-sm">
                    <i data-lucide="folder-down" class="w-4 h-4"></i> Nhập ZIP
                </button>
                <input type="file" id="importFile" hidden accept=".zip" onchange="importDataZip(event)">
            </div>

            <button onclick="openModal()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl mb-4 transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
                <i data-lucide="plus-circle"></i>
                <span>Thêm Media Mới</span>
            </button>

            <div id="videoList" class="flex-grow overflow-y-auto space-y-3 pr-1 pb-10"></div>
        </div>

        <div class="flex-1 bg-black rounded-3xl shadow-2xl overflow-hidden flex flex-col relative min-h-[400px]">
            <div id="previewContainer" class="flex-1 flex items-center justify-center p-2 relative text-center">
                <div class="text-white opacity-30">
                    <i data-lucide="play-circle" class="w-20 h-20 mx-auto mb-4"></i>
                    <p class="text-xl font-medium">Chọn video từ danh sách để phát</p>
                </div>
            </div>

            <div id="playingInfo" class="hidden px-4 md:px-6 py-4 bg-white/10 text-white text-sm backdrop-blur-md border-t border-white/10">
                <div class="flex flex-col xl:flex-row items-center justify-between gap-3">
                    <div class="flex items-center gap-3 overflow-hidden w-full xl:w-auto">
                        <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse flex-shrink-0"></div>
                        <span id="currentTitle" class="font-bold text-lg truncate max-w-[200px] md:max-w-md"></span>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-center xl:justify-end gap-4 w-full xl:w-auto">
                        
                        <div class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-full border border-white/10" title="Bật/Tắt tính năng tự dừng tại điểm ghim">
                            <span class="text-xs font-bold text-gray-300">Auto Stop</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="autoPauseToggle" class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#f5576c]"></div>
                            </label>
                        </div>

                         <div class="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
                            <i data-lucide="gauge" class="w-4 h-4 text-yellow-400"></i>
                            <select id="speedControl" onchange="changePlaybackSpeed(this.value)" class="bg-transparent border-none text-white text-xs font-bold outline-none cursor-pointer appearance-none text-center min-w-[40px]">
                                <option value="0.5" class="text-black">0.5x</option>
                                <option value="0.75" class="text-black">0.75x</option>
                                <option value="1" class="text-black" selected>1.0x</option>
                                <option value="1.25" class="text-black">1.25x</option>
                                <option value="1.5" class="text-black">1.5x</option>
                                <option value="2" class="text-black">2.0x</option>
                            </select>
                         </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-start md:items-center justify-center p-0 md:p-4 backdrop-blur-sm overflow-y-auto">
        <div class="bg-white w-full max-w-5xl min-h-screen md:min-h-0 md:rounded-[2rem] shadow-2xl flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-50 bg-gray-100 hover:bg-red-500 hover:text-white w-8 h-8 rounded-full transition-colors flex items-center justify-center shadow-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex-1 p-6 border-b md:border-b-0 md:border-r border-gray-100 flex flex-col">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="settings" class="text-gray-400"></i> Thiết lập Media
                </h3>
                <div id="modalPlayerContainer" class="bg-black rounded-2xl aspect-video mb-4 flex items-center justify-center overflow-hidden shadow-inner">
                    <p class="text-gray-400 text-sm italic">Vui lòng chọn file để xem trước</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Bắt đầu (s)</label>
                            <input type="number" id="editStart" value="0" class="w-full mt-1 border border-gray-200 rounded-lg p-2 outline-none focus:border-blue-400">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Kết thúc (s)</label>
                            <div class="flex gap-2 items-center mt-1">
                                <input type="number" id="editEnd" value="0" class="w-full border border-gray-200 rounded-lg p-2 outline-none focus:border-blue-400">
                                <button onclick="setEndToMax()" class="bg-gray-200 p-2 rounded hover:bg-gray-300 text-xs font-bold" title="Lấy độ dài tối đa">MAX</button>
                            </div>
                        </div>
                    </div>
                    <button onclick="ghimPausePointModal()" class="w-full bg-[#f5576c] text-white py-2 rounded-lg font-bold shadow-md hover:opacity-90 flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="map-pin" class="w-4 h-4"></i> Ghim Điểm Dừng Hiện Tại
                    </button>
                    <button id="btnPickFile" onclick="document.getElementById('multiFilePicker').click()" class="w-full bg-blue-500 text-white py-2 rounded-lg font-bold hover:bg-blue-600 flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="file-video" class="w-4 h-4"></i> Chọn File Media (Video/Audio)
                    </button>
                    <input type="file" id="multiFilePicker" hidden multiple accept="video/*,audio/*" onchange="handleMultiSelect(event)">
                </div>
            </div>

            <div class="w-full md:w-[380px] p-6 flex flex-col">
                <div class="flex-none">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Tên hiển thị</label>
                    <input type="text" id="editName" class="w-full mt-1 mb-4 border border-gray-200 rounded-lg p-3 outline-none focus:border-blue-400 font-semibold">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Các điểm dừng đã ghim</label>
                </div>
                <div id="pausePointsEditor" class="flex-grow overflow-y-auto space-y-2 mb-4 p-1 min-h-[200px] max-h-[400px]"></div>
                <div class="flex-none flex gap-3 mt-auto pt-4 border-t border-gray-100">
                    <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300">Hủy</button>
                    <button id="btnSaveMedia" onclick="saveMedia()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="save" class="w-5 h-5"></i> Lưu Lại
                    </button>
                </div>
            </div>
        </div>
    </div>

<script>
        const dbAEON = new Dexie("AEON_Pro_Storage");
        dbAEON.version(2).stores({ media: "++id, name, order" });

        let db = [];
        let currentIndex = -1, editingIndex = -1, tempFilesData = []; 
        let currentObjectURL = null;
        let sortableInstance = null;

        // --- SHORTCUT KEYS ---
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const player = document.getElementById('mainPlayer');
            if (!player) return;

            switch(e.code) {
                case 'Space': 
                    e.preventDefault();
                    player.paused ? player.play() : player.pause();
                    break;
                case 'KeyF':
                    if (player.requestFullscreen) player.requestFullscreen();
                    break;
                case 'KeyM':
                    player.muted = !player.muted;
                    break;
            }
        });

        // --- DATABASE & RENDER ---
        async function loadDataFromDB() {
            db = await dbAEON.media.orderBy('order').toArray();
            if (db.length > 0 && db[0].order === undefined) {
                for (let i = 0; i < db.length; i++) {
                    await dbAEON.media.update(db[i].id, { order: i });
                }
                db = await dbAEON.media.orderBy('order').toArray();
            }
            document.getElementById('itemCount').innerText = `${db.length} mục`;
            renderVideoList();
        }

        function renderVideoList() {
            const list = document.getElementById('videoList');
            if (db.length === 0) { 
                list.innerHTML = '<div class="flex flex-col items-center mt-20 text-gray-400"><i data-lucide="inbox" class="w-12 h-12 mb-3 opacity-20"></i><p>Chưa có video nào</p></div>'; 
                lucide.createIcons(); 
                return; 
            }
            
            const mainPlayer = document.getElementById('mainPlayer');

            list.innerHTML = db.map((item, idx) => {
                const isActive = currentIndex === idx;
                const isPlaying = isActive && mainPlayer && !mainPlayer.paused;

                return `
                    <div class="video-item group p-3 rounded-2xl bg-white border-2 border-transparent transition-all ${isActive ? 'active' : 'hover:border-gray-200'}" data-id="${item.id}">
                        <div class="flex gap-3">
                            <div class="drag-handle flex items-center justify-center text-gray-300 hover:text-gray-500 cursor-grab active:cursor-grabbing p-1">
                                <i data-lucide="grip-vertical" class="w-5 h-5"></i>
                            </div>

                            <div class="flex-1">
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <div class="flex-1 cursor-pointer" onclick="playMedia(${idx})">
                                        <h4 class="font-bold text-sm leading-tight text-gray-800 line-clamp-2">${idx + 1}. ${item.name}</h4>
                                        <div class="flex items-center gap-2 mt-1">
                                            ${isPlaying ? '<span class="is-playing-icon">●</span>' : ''}
                                            <span class="text-[10px] ${isActive ? 'text-rose-500' : 'text-green-600'} font-bold tracking-tighter uppercase">
                                                ${isActive ? (isPlaying ? 'Đang phát' : 'Đang chọn') : 'Sẵn sàng'}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="flex gap-1 opacity-100 lg:opacity-0 lg:group-hover:opacity-100 transition-opacity">
                                        <button onclick="ghimToSpecific(${idx})" class="p-2 bg-rose-50 text-rose-500 rounded-lg hover:bg-rose-500 hover:text-white transition-colors" title="Ghim nhanh">
                                            <i data-lucide="map-pin" class="w-4 h-4"></i>
                                        </button>
                                        <button onclick="togglePlayPauseFromList(event, ${idx})" class="p-2 ${isActive ? 'bg-amber-100 text-amber-600' : 'bg-blue-50 text-blue-500'} rounded-lg hover:opacity-80 transition-colors">
                                            <i data-lucide="${isPlaying ? 'pause' : 'play'}" class="w-4 h-4 fill-current"></i>
                                        </button>
                                        <button onclick="openModal(${idx})" class="p-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200">
                                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                                        </button>
                                        <button onclick="deleteMedia(${idx})" class="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-colors">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="space-y-1 border-t border-gray-50 pt-2 ${item.pausePoints.length === 0 ? 'hidden' : ''}">
                                    ${item.pausePoints.map((p, pIdx) => `
                                        <div class="pause-row flex items-center justify-between bg-gray-50 hover:bg-rose-50 px-3 py-1.5 rounded-lg cursor-pointer transition-all border-l-2 border-blue-400" onclick="jumpTo(event, ${p.time}, ${idx})">
                                            <div class="text-[11px] font-medium text-gray-600 w-full flex items-center gap-2" >
                                                <i data-lucide="clock" class="w-3 h-3 text-rose-400"></i>
                                                <strong class="text-rose-600">${p.time}s</strong> — ${p.hint}
                                            </div>
                                            <button onclick="deletePointInList(event, ${idx}, ${pIdx})" class="text-gray-300 hover:text-red-500 transition-colors">
                                                <i data-lucide="x-circle" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            const el = document.getElementById('videoList');
            if(sortableInstance) sortableInstance.destroy();
            sortableInstance = Sortable.create(el, {
                handle: '.drag-handle',
                animation: 150,
                ghostClass: 'drag-ghost',
                onEnd: async function(evt) {
                    const itemDivs = document.querySelectorAll('#videoList .video-item');
                    const updates = [];
                    itemDivs.forEach((div, index) => {
                        const id = parseInt(div.getAttribute('data-id'));
                        updates.push(dbAEON.media.update(id, { order: index }));
                    });
                    await Promise.all(updates);
                    db = await dbAEON.media.orderBy('order').toArray();
                    renderVideoList();
                }
            });
        }

        // --- PLAYER LOGIC ---
        async function playMedia(idx) {
            if (idx >= db.length) return;

            const item = db[idx];
            currentIndex = idx;

            if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
            currentObjectURL = URL.createObjectURL(item.fileBlob);

            const container = document.getElementById('previewContainer');
            container.innerHTML = `<video id="mainPlayer" controls class="shadow-2xl" style="width:100%; height:100%"><source src="${currentObjectURL}"></video>`;
            const player = document.getElementById('mainPlayer');
            
            document.getElementById('playingInfo').classList.remove('hidden');
            document.getElementById('currentTitle').innerText = item.name;
            
            const currentSpeed = document.getElementById('speedControl').value;
            player.playbackRate = parseFloat(currentSpeed);

            player.currentTime = item.startTime;
            player.play().catch(e => console.log("Auto-play blocked"));

            player.ontimeupdate = () => {
                const now = Math.floor(player.currentTime);
                const exactTime = player.currentTime;

                if (item.endTime > 0 && exactTime >= item.endTime) { 
                    if (currentIndex < db.length - 1) {
                        playMedia(currentIndex + 1);
                    } else {
                        player.pause();
                    }
                    return; 
                }
            };

            player.onended = () => {
                if (currentIndex < db.length - 1) {
                    playMedia(currentIndex + 1);
                }
            };

            player.onplay = () => { renderVideoList(); };
            player.onpause = () => { renderVideoList(); };
            renderVideoList();
        }

        function togglePlayPauseFromList(event, idx) {
            event.stopPropagation();
            const player = document.getElementById('mainPlayer');
            if (currentIndex === idx && player) {
                player.paused ? player.play() : player.pause();
            } else {
                playMedia(idx);
            }
        }

        function changePlaybackSpeed(val) {
            const player = document.getElementById('mainPlayer');
            if (player) {
                player.playbackRate = parseFloat(val);
            }
        }

        // --- FIX: JUMP TO LOGIC ---
        function jumpTo(event, time, idx) {
            event.stopPropagation(); // Ngăn sự kiện click lan ra ngoài

            // Trường hợp 1: Click vào điểm dừng của video KHÁC
            if (idx !== currentIndex) {
                playMedia(idx).then(() => {
                    setTimeout(() => {
                        applyJumpLogic(time);
                    }, 500); // Đợi video load xong
                });
                return;
            }

            // Trường hợp 2: Click vào điểm dừng của video ĐANG CHỌN
            applyJumpLogic(time);
        }

        function applyJumpLogic(time) {
            const p = document.getElementById('mainPlayer');
            const isAutoStopEnabled = document.getElementById('autoPauseToggle').checked;
            if (p) {
                p.currentTime = time;

                if (isAutoStopEnabled) {
                    // Nếu BẬT Auto Stop -> Dừng
                    p.pause();
                } else {
                    // Nếu TẮT Auto Stop -> Chờ 1 chút để tua xong rồi phát
                    setTimeout(() => {
                        p.play()
                    }, 100);
                }
            }
        }

        function ghimToSpecific(idx) {
            event.stopPropagation();
            const player = document.getElementById('mainPlayer');
            if (currentIndex !== idx || !player) return alert("Vui lòng phát video này trước!");

            const wasPlaying = !player.paused;
            player.pause();

            const time = Math.floor(player.currentTime);
            const hint = prompt(`Thêm ghi chú tại ${time} giây:`, "Điểm dừng mới");

            if (hint !== null) {
                db[idx].pausePoints.push({ time, hint: hint || "Ghi chú..." });
                db[idx].pausePoints.sort((a, b) => a.time - b.time);
                dbAEON.media.update(db[idx].id, { pausePoints: db[idx].pausePoints });
                renderVideoList();
            }
            if (wasPlaying) player.play();
        }

        function deletePointInList(event, vIdx, pIdx) {
            event.stopPropagation(); 
            if (confirm("Xóa điểm dừng này?")) {
                db[vIdx].pausePoints.splice(pIdx, 1);
                dbAEON.media.update(db[vIdx].id, { pausePoints: db[vIdx].pausePoints });
                renderVideoList();
            }
        }

        // --- FILE & MODAL ---
        async function handleMultiSelect(event) {
            const files = Array.from(event.target.files);
            const btnPick = document.getElementById('btnPickFile');
            btnPick.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Đang tải ${files.length} file...`;
            lucide.createIcons();
            
            tempFilesData = [];
            for (let file of files) {
                tempFilesData.push({ name: file.name.split('.')[0], fileBlob: file });
            }
            
            if (tempFilesData.length > 0) {
                const previewUrl = URL.createObjectURL(tempFilesData[0].fileBlob);
                setupModalPlayer(previewUrl);
                document.getElementById('editName').value = tempFilesData[0].name;
                document.getElementById('editStart').value = 0;
            }
            
            btnPick.innerHTML = `<i data-lucide="file-video" class="w-4 h-4"></i> Chọn File Media`;
            lucide.createIcons();
        }

        function setupModalPlayer(src) {
            const container = document.getElementById('modalPlayerContainer');
            container.innerHTML = `<video id="modalPlayer" controls class="max-h-full h-full w-full"><source src="${src}"></video>`;
            const p = document.getElementById('modalPlayer');
            
            p.onloadedmetadata = () => { 
                const duration = Math.floor(p.duration);
                if (editingIndex === -1 || tempFilesData.length > 0) {
                     document.getElementById('editEnd').value = duration;
                }
            };
        }

        function setEndToMax() {
            const p = document.getElementById('modalPlayer');
            if(p && p.duration) {
                document.getElementById('editEnd').value = Math.floor(p.duration);
            }
        }

        async function saveMedia() {
            const name = document.getElementById('editName').value || "Chưa đặt tên";
            const startTime = parseInt(document.getElementById('editStart').value) || 0;
            const endTime = parseInt(document.getElementById('editEnd').value) || 0;
            const rows = document.querySelectorAll('#pausePointsEditor > div');
            const pausePoints = Array.from(rows).map(r => ({
                time: parseInt(r.querySelectorAll('input')[0].value),
                hint: r.querySelectorAll('input')[1].value
            })).sort((a,b) => a.time - b.time);

            const btnSave = document.getElementById('btnSaveMedia');
            btnSave.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Đang lưu...`;
            btnSave.disabled = true;

            if (editingIndex > -1) {
                const id = db[editingIndex].id;
                const updateObj = { name, startTime, endTime, pausePoints };
                if (tempFilesData.length > 0) {
                    updateObj.fileBlob = tempFilesData[0].fileBlob;
                }
                await dbAEON.media.update(id, updateObj);
            } else {
                for (let f of tempFilesData) {
                    const count = await dbAEON.media.count();
                    await dbAEON.media.add({ 
                        name: f.name, 
                        fileBlob: f.fileBlob, 
                        startTime, 
                        endTime, 
                        pausePoints: [...pausePoints],
                        order: count
                    });
                }
            }
            
            await loadDataFromDB();
            closeModal();
            btnSave.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i> Lưu Lại`;
            btnSave.disabled = false;
        }

        function openModal(idx = -1) {
            const mainPlayer = document.getElementById('mainPlayer');
            if (mainPlayer) mainPlayer.pause();

            editingIndex = idx; 
            tempFilesData = [];
            document.getElementById('editModal').classList.remove('hidden');
            document.body.classList.add('modal-open');
            document.getElementById('pausePointsEditor').innerHTML = '';
            
            if (idx > -1) {
                const item = db[idx];
                document.getElementById('editName').value = item.name;
                document.getElementById('editStart').value = item.startTime;
                document.getElementById('editEnd').value = item.endTime;
                item.pausePoints.forEach(p => addPausePointRow(p.time, p.hint));
                setupModalPlayer(URL.createObjectURL(item.fileBlob));
            } else {
                document.getElementById('editName').value = '';
                document.getElementById('editStart').value = 0;
                document.getElementById('editEnd').value = 0;
                document.getElementById('modalPlayerContainer').innerHTML = '<p class="text-gray-400 text-sm italic">Chọn file để bắt đầu</p>';
            }
            lucide.createIcons();
        }

        function closeModal() { 
            const modalPlayer = document.getElementById('modalPlayer');
            if (modalPlayer) {
                modalPlayer.pause();
                modalPlayer.src = "";
                modalPlayer.load();
            }
            document.getElementById('modalPlayerContainer').innerHTML = '<p class="text-gray-400 text-sm italic">Vui lòng chọn file để xem trước</p>';
            document.getElementById('editModal').classList.add('hidden'); 
            document.body.classList.remove('modal-open'); 
        }

        function ghimPausePointModal() {
            const p = document.getElementById('modalPlayer');
            if (p) addPausePointRow(Math.floor(p.currentTime), "Ghi chú...");
        }

        function addPausePointRow(time, hint) {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center bg-white p-2 rounded-xl border border-gray-100 shadow-sm mb-2';
            div.innerHTML = `
                <input type="number" value="${time}" class="w-16 p-1 border rounded text-xs font-bold text-rose-500">
                <input type="text" value="${hint}" class="flex-1 p-1 border rounded text-xs" placeholder="Ghi chú...">
                <button onclick="this.parentElement.remove()" class="text-gray-300 hover:text-red-500 transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            `;
            document.getElementById('pausePointsEditor').appendChild(div);
            lucide.createIcons();
        }

        async function exportDataZip() {
            if (db.length === 0) return alert("Playlist trống!");
            const btn = document.getElementById('btnExport');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> Đang nén...`;
            lucide.createIcons();

            try {
                const zip = new JSZip();
                const metadata = [];
                for (let item of db) {
                    const safeName = item.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                    const fileName = `media_${item.id}_${safeName}.mp4`;
                    zip.file(fileName, item.fileBlob);
                    metadata.push({
                        name: item.name,
                        startTime: item.startTime,
                        endTime: item.endTime,
                        pausePoints: item.pausePoints,
                        fileName: fileName,
                        order: item.order
                    });
                }
                zip.file("aeon_config.json", JSON.stringify(metadata));
                const content = await zip.generateAsync({type: "blob"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(content);
                a.download = `PRO_Player_Backup_${new Date().toISOString().slice(0,10)}.zip`;
                a.click();
            } catch (e) { alert("Lỗi khi nén file: " + e.message); } 
            finally {
                btn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }

        async function importDataZip(e) {
            const file = e.target.files[0];
            if (!file) return;
            const btn = document.getElementById('btnImport');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> Đang giải nén...`;
            lucide.createIcons();

            try {
                const zip = await JSZip.loadAsync(file);
                const configData = await zip.file("aeon_config.json").async("string");
                const metadata = JSON.parse(configData);

                if(confirm(`Tìm thấy ${metadata.length} mục. Bạn có muốn ghi đè danh sách hiện tại?`)) {
                    await dbAEON.media.clear();
                    for(let item of metadata) {
                        const videoBlob = await zip.file(item.fileName).async("blob");
                        await dbAEON.media.add({
                            name: item.name,
                            startTime: item.startTime,
                            endTime: item.endTime,
                            pausePoints: item.pausePoints,
                            fileBlob: videoBlob,
                            order: item.order || 0
                        });
                    }
                    await loadDataFromDB();
                    alert("Đã nhập dữ liệu thành công!");
                }
            } catch (err) { alert("Lỗi khi đọc file ZIP. File không đúng định dạng."); } 
            finally {
                btn.innerHTML = originalHTML;
                lucide.createIcons();
                e.target.value = "";
            }
        }

        async function deleteMedia(idx) { 
            event.stopPropagation();
            if(confirm('Xóa vĩnh viễn mục này?')) { 
                await dbAEON.media.delete(db[idx].id); 
                await loadDataFromDB(); 
            } 
        }

        loadDataFromDB();
    </script>
</body>
</html>
